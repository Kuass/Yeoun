name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to release (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          test -f "docs/releases/$RELEASE_TAG.md"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YEOUN_KEYSTORE_BASE64 }}
        run: |
          umask 077
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yeoun-release.jks"
      - name: Build and test signed release
        env:
          YEOUN_KEYSTORE_PATH: ${{ runner.temp }}/yeoun-release.jks
          YEOUN_KEYSTORE_PASSWORD: ${{ secrets.YEOUN_KEYSTORE_PASSWORD }}
          YEOUN_KEY_ALIAS: ${{ secrets.YEOUN_KEY_ALIAS }}
          YEOUN_KEY_PASSWORD: ${{ secrets.YEOUN_KEY_PASSWORD }}
        run: ./gradlew --no-configuration-cache -PrequireReleaseSigning=true testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and package public assets
        run: python3 scripts/package-release.py "$RELEASE_TAG"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" build/release-assets/* --verify-tag --draft --title "Yeoun $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/yeoun-release.jks"
